{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>{{ 'Login' if mode == 'login' else 'Criar Conta' }}</h2>

        {% if error %}
        <div style="color: #ff1744; margin-bottom: 15px; font-size: 0.9rem;">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">{{ 'Entrar' if mode == 'login' else 'Cadastrar' }}</button>
        </form>

        <div class="auth-switch">
            {% if mode == 'login' %}
            Novo por aqui? <a href="{{ url_for('register') }}">Crie uma conta</a>
            {% else %}
            Já tem conta? <a href="{{ url_for('login') }}">Fazer Login</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

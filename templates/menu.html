{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Bem-vindo, {{ username }}</h1>
    <p style="color: var(--text-muted)">Escolha as tabuadas que deseja praticar hoje.</p>
</div>

<div class="action-bar"
    style="text-align: right; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">

    <!-- Time Selection -->
    <div style="text-align: left;">
        <label style="color: var(--text-muted); font-size: 0.9rem; margin-right: 10px;">Tempo por conta:</label>
        <select id="time-select"
            style="padding: 10px; background: #252525; color: white; border: 1px solid #444; border-radius: 8px;">
            <option value="5">5 Segundos</option>
            <option value="10">10 Segundos</option>
        </select>
    </div>

    <div>
        <button class="btn" onclick="selectAll()" style="width: auto; background: #333;">Selecionar Todas</button>
        <button class="btn" onclick="clearSelection()" style="width: auto; background: #333;">Limpar</button>
    </div>
</div>

<div class="grid-container">
    {% for i in range(1, 11) %}
    <div class="table-card" onclick="toggleTable(this, {{ i }})" id="card-{{ i }}">
        <h3>{{ i }}</h3>
        <span style="font-size: 0.8rem; color: #666;">Tabuada do {{ i }}</span>
    </div>
    {% endfor %}
</div>

<div class="action-bar">
    <button class="btn btn-large" onclick="startGame()">Começar Prática</button>
</div>

<script>
    let selected = new Set();

    // Auto-select based on previous if needed, or simple toggle
    function toggleTable(el, num) {
        if (selected.has(num)) {
            selected.delete(num);
            el.classList.remove('selected');
        } else {
            selected.add(num);
            el.classList.add('selected');
        }
    }

    function selectAll() {
        for (let i = 1; i <= 10; i++) {
            selected.add(i);
            const card = document.getElementById('card-' + i);
            if (card) card.classList.add('selected');
        }
    }

    function clearSelection() {
        selected.clear();
        document.querySelectorAll('.table-card').forEach(el => el.classList.remove('selected'));
    }

    function startGame() {
        if (selected.size === 0) {
            alert("Por favor, selecione pelo menos uma tabuada.");
            return;
        }
        const tables = Array.from(selected).join(',');
        const time = document.getElementById('time-select').value;
        const url = "{{ url_for('game') }}?tables=" + tables + "&time=" + time;
        window.location.href = url;
    }
</script>
{% endblock %}

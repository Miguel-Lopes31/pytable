{% extends "base.html" %}

{% block content %}
<!-- Hidden config -->
<!-- We pass 'tables' and 'time' from query params to the dataset -->
<div id="game-data" data-tables="{{ tables|default('1') }}" data-time="{{ request.args.get('time', 10) }}"
    data-mode="{{ request.args.get('mode', 'normal') }}" data-homework-id="{{ request.args.get('homework_id', '') }}"
    data-global-time="{{ request.args.get('global_time', 60) }}">
</div>

<div class="overlay" id="overlay">
    <div style="text-align: center;">
        <div class="countdown-number" id="countdown">5</div>
        <p style="color: #666; margin-top: 10px;">Preparar...</p>
    </div>
</div>

<div class="game-area">
    <!-- Global Timer Display (only shown in time_attack mode) -->
    <div id="global-timer-display" class="global-timer" style="display: none;">
        <span id="global-timer-text">1:00</span>
    </div>

    <div style="position: absolute; top: 0; right: 0; font-size: 1.2rem; color: var(--primary-blue);"
        id="score-display">Pontos: 0</div>

    <div
        style="width: 100%; max-width: 500px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 40px; overflow: hidden;">
        <div id="progress-bar"
            style="width: 100%; height: 100%; background: var(--success); transition: width 0.1s linear;"></div>
    </div>

    <div class="question-box" id="question">Carregando...</div>

    <div class="options-grid" id="options-container">
        <!-- Generated by JS -->
    </div>

    <a href="{{ url_for('menu') }}" style="margin-top: 50px; color: #555; font-size: 0.9rem;">Sair do Jogo</a>
</div>

<script src="{{ url_for('static', filename='js/game.js') }}"></script>
{% endblock %}
